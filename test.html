<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShortDist</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.8.0/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
        }
        #myLatitude {
            z-index: 10000;
            padding: 8px;
            width: 80%;
            border-color: green;
            border-width: 2px;
            border-style: solid;
            border-radius: 10px;
        }
        #myLongitude {
            z-index: 10000;
            padding: 8px;
            width:80%;
            border-radius: 10px;
            border-color:rgb(12, 94, 156);
            border-width: 2px;
            border-style: solid;
        }
        #myDesintationLatitude {
            z-index: 10000;
            padding: 8px;
            width: 80%;
            border-color:green;
            border-width:2px;
            border-style:solid;
            border-radius:10px;
        }
        #myDesintationLongitude {
            z-index: 10000;
            padding: 8px;
            width:78%;
            border-radius: 10px;
            border-color:rgb(12, 94, 156);
            border-width: 2px;
            border-style: solid;
        }
        #location_inputs {
            position:absolute;
            display: grid;
            grid-template-areas: "auto";
            padding: 10px;
            z-index:10000;
            /* originally thought padding would add space between the inputs, 
            but really the way to do it is with gap to add spacing in between
            ELEMENTS!
             */
            gap:10%;
            top:10%;

        }
        #submit{
            padding:8px;
            border-radius:50px;
            width:30%;
            background-image:linear-gradient(to right, rgb(11, 173, 92) , rgb(1, 59, 0));
            color:white;
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            border-color:rgb(0, 0, 0);
            border-style:solid;
        }
        #fillCurrentLoc{
            padding:8px;
            border-radius:50px;
            width:60%;
            background-image:linear-gradient(to right, rgb(26, 95, 33), rgb(60, 147, 16));
            color:white;
            border-color:rgb(2, 3, 3);
            border-style:solid;
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #locationTitle{
            color:white;
            background-color:rgb(65, 130, 108);
            padding-right:10px;
            padding-left:10px;
            border-radius:15px;
            padding-top:5px;
            padding-bottom:5px;
            font-size:18px;
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            border-width:2px;
            border-color:rgb(4, 4, 4);
            border-style:solid;
        }
        #destinationTitle{
            color:white;
            background-color:rgb(65, 130, 108);
            padding-right:10px;
            padding-left:10px;
            border-radius:15px;
            padding-top:5px;
            padding-bottom:5px;
            font-size:18px;
            border-width:2px;
            border-color:rgb(4, 4, 4);
            border-style:solid;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
    </style>
</head>
<body>
    <div id="map" style="width:100%; height:100vh;">
        <!-- the problem with the input here is that barebones like this,
        it leaflet detects a 'click' location under the input area. 
        to fix this we add an event listener and don't listen for events 
        happening on the input area: -->

        <div id="location_inputs">
            <h1 id="locationTitle">Your location info HERE:</h1>
            <input type="text" id="myLongitude" placeholder="Current Longitude here">
            <input type="text" id="myLatitude" placeholder="Current Latitude here">
            <h1 id="destinationTitle">Your destination info HERE:</h1>
            <input type="text" id="myDesintationLongitude" placeholder="Location Longitude">
            <input type="text" id="myDesintationLatitude" placeholder="Location Latitude">
            <div class="btnGrid">
                <button id="submit" type="submit">Start</button>
                <button id="fillCurrentLoc" type="submit">Get and fill Current Location</button>
            </div>
            <div id="displayDirections">
        </div>
        </div>

    </div>
    <script src="https://unpkg.com/leaflet@1.8.0/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
    <script>
        const map = L.map('map').setView([40.0001, -75.1956], 11);
        const tileLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributor',
            maxZoom: 19
        }).addTo(map);
        const taxiIcon = L.icon({
            iconUrl: 'https://cn-geo1.uber.com/image-proc/crop/resizecrop/udam/format=auto/width=835/height=470/srcb64=aHR0cHM6Ly90Yi1zdGF0aWMudWJlci5jb20vcHJvZC91ZGFtLWFzc2V0cy8xZDI2ZDMwYS0zMTNhLTQ3ZjktYTdjYS1kZDllMmRhZTk0NDUucG5n',
            iconSize: [130, 70]
        })

        const markerMyLoc = L.marker([40.0001, -75.1956], { icon: taxiIcon }).addTo(map);

        const inputMyLongitudeID = document.getElementById("myLongitude")
        const inputMyLongitudeVal = inputMyLongitudeID.value;
        const inputMyLatitudeID = document.getElementById("myLatitude");
        const inputMyLatitudeVal = inputMyLatitudeID.value;

        const inputLocationLongitudeID = document.getElementById("myDesintationLongitude")
        const inputLocationLongitudeVal = inputLocationLongitudeID.value;
        const inputLocationLatitudeID = document.getElementById("myDesintationLatitude");
        const inputLocationLatitudeVal = inputLocationLatitudeID.value;

        const stopListening1 = document.getElementById("myLongitude");
        const stopListening2 = document.getElementById("myLatitude");
        const stopListening3 = document.getElementById("myDesintationLongitude");
        const stopListening4 = document.getElementById("myDesintationLatitude");

        // if(inputDesintationVal){
        //     const marker = L.marker([])
        // }
        function showDirections(route) {
    const directionsDiv = document.getElementById('displayDirections');
    let html = '<strong>Directions:</strong><ol>';
    route.instructions.forEach(function(step) {
        html += '<li>' + step.text + '</li>';
    });
    html += '</ol>';
    directionsDiv.innerHTML = html;
}
        // this is the fix for the input, leaflet provides a solution for this:
        L.DomEvent.disableClickPropagation(stopListening1);
        L.DomEvent.disableClickPropagation(stopListening2);
        L.DomEvent.disableClickPropagation(stopListening3);
        L.DomEvent.disableClickPropagation(stopListening4);
        L.DomEvent.disableClickPropagation(document.getElementById('location_inputs'));

        document.getElementById('submit').addEventListener('click', function() {
    const startLat = parseFloat(inputMyLatitudeID.value);
    const startLng = parseFloat(inputMyLongitudeID.value);
    const endLng = parseFloat(inputLocationLongitudeID.value);
    const endLat = parseFloat(inputLocationLatitudeID.value);

    markerMyLoc.setLatLng([startLat, startLng]);
    L.Routing.control({
        waypoints: [
            L.latLng(startLat, startLng),
            L.latLng(endLat, endLng)
        ]
    }).on('routesfound', function(e) {
        showDirections(e.routes[0]);
        e.routes[0].coordinates.forEach(function (coord, index) {
            setTimeout(function () {
                markerMyLoc.setLatLng([coord.lat, coord.lng]);
            }, 100 * index)
        })
    }).addTo(map);
});

map.on('click', function (e) {
    const newMarker = L.marker([e.latlng.lat, e.latlng.lng]).addTo(map);
    L.Routing.control({
        waypoints: [
            markerMyLoc.getLatLng(),
            L.latLng(e.latlng.lat, e.latlng.lng)
        ]
    }).on('routesfound', function (e) {
        showDirections(e.routes[0]);
        e.routes[0].coordinates.forEach(function (coord, index) {
            setTimeout(function () {
                markerMyLoc.setLatLng([coord.lat, coord.lng]);
            }, 100 * index)
        })
    }).addTo(map);
});

document.getElementById('fillCurrentLoc').addEventListener('click', function() {
    navigator.geolocation.getCurrentPosition(function(position) {
        inputMyLatitudeID.value = position.coords.latitude;
        inputMyLongitudeID.value = position.coords.longitude;
    }, function(error) {
        alert("Couldn't get your location :'(" + error.message);
    });
});

        // so this works when you click on the map, and where user clicks.

        // map.on(stopListening.innerHTML, function(e) {
        // })
    </script>
</body>
</html>
