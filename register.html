<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find It!</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="script.js" defer></script>
</head>
<body>
    <nav>
        <div id="home_nav"><a href="index.html"><img style="width: 40px;" src="images/find it title.png" alt="Home"></a></div>
        <div id="location_nav" style="display: none;">Allow Location</div>
        <div id="login_nav"><a href="login.html">Login</a></div>
        <div id="register_nav"><a href="register.html">Register</a></div>
    </nav>

    <form id="register_form">
        <div id="register_div">
            
            <input 
            style="padding: 12px 20px;" 
            type="email" 
            id="email_register" 
            placeholder="Email" 
            required 
            >
            
            <input 
            style="padding: 12px 20px;" 
            type="password" 
            id="password_register" 
            placeholder="Password" 
            required
            >
            
            <button 
            style="padding: 12px 20px;" 
            type="submit" 
            id="register_button"
            >Register</button>
            
        </div>      
    </form>

</body>
</html>
