<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find It!</title>

    <link rel="stylesheet" href="style.css">

    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link rel="stylesheet" href="https://unpkg.com"/>
    <script src="https://unpkg.com"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

    <script src="script.js" defer></script>

</head>
<body>
    <nav>
        <div id="home_nav"><a href="index.html"><img style="width: 40px;" src="images/find it title.png" alt="Home"></a></div>
        <div id="location_nav" style="display: block;">Allow Location</div>
        <div id="login_nav"><a href="login.html">Login</a></div>
        <div id="register_nav"><a href="register.html">Register</a></div>
        <div id="logout_nav" style="display: none;"><a href="#" id="logout_btn">Log Out</a></div>
    </nav>
    
    <div id="locationModal" class="modal-overlay">
        <div class="modal-box">
            <h3>Find Nearby Features</h3>
            <p>This website uses your location to center the map automatically. Would you like to share your location?</p>
            <div class="modal-buttons">
                <button id="denyLocationBtn" class="btn btn-secondary">No, Use Default</button>
                <button id="allowLocationBtn" class="btn btn-primary">Yes, Allow</button>
            </div>
        </div>
    </div>
    
    <div id="map_wrapper">
        <div id="map_cont">

        </div>    
    </div>

    <div id="order_request"> 
        <p>Add Listing</p> 
        <img id="plus_button" src="images/plus_button.png"> 
        
        <div class="break"></div>
            <form id="list_form">
                <input class="list-element" id="list_name" type="text" placeholder="Item Name" required>
                <input class="list-element" id="list_description" type="text" placeholder="Optional Description">
                

                <div id="location_wrapper" class="list-element">
                    <input id="list_location" type="text" placeholder="Optional Location" autocomplete="off" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-family: 'Poppins', sans-serif;">
                    <div id="address_suggestions" class="suggestions-dropdown"></div>
                </div>

                <button class="list-element" id="list_submit" type="submit">List Item</button>
            </form>


    </div>
    
    <div id="displayDirections"></div>

    <section id="listings">

    </section>


</body>
</html>
