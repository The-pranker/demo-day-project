<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>placeholder</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <script type="module" src="app.js" defer></script>
</head>
<body>
    <nav>
        <div id="home_nav"><a href="index.html">Home</a></div>
        <div id="login_nav"><a href="login.html">Login</a></div>
        <div id="register_nav"><a href="register.html">Register</a></div>
    </nav>

    <form id="login_form">
        <div id="login_div">
            
            <input 
            style="padding: 12px 20px;" 
            type="email" 
            id="email_login" 
            placeholder="Email" 
            required 
            >
            
            <input 
            style="padding: 12px 20px;" 
            type="password" 
            id="password_login" 
            placeholder="Password" 
            required
            >
            
            <button 
            style="padding: 12px 20px;" 
            type="submit" 
            id="login_button"
            >Login</button>
            
        </div>      
    </form>



</body>
</html>
